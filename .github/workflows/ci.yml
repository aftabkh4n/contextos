name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Cache embeddings model
        id: cache-model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: src/ContextOS.Embeddings/Models
          key: minilm-l6-v2-onnx-v1

      - name: Fetch embeddings model
        if: steps.cache-model.outputs.cache-hit != 'true'
        run: bash scripts/fetch-model.sh

      - name: Build
        run: dotnet build --no-restore /p:TreatWarningsAsErrors=true

      - name: Smoke test embeddings on this OS
        run: |
          cd src/ContextOS.Mcp
          timeout 30 dotnet run --no-build -- --selftest

      - name: Test
        run: dotnet test --no-build --verbosity normal
